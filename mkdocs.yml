site_name: Metagenomics Summer School
site_author: Genomics Aotearoa & NeSI
site_dir: public
site_url: "https://genomicsaotearoa.github.io/metagenomics_summer_school/"

#Repository information

repo_name:   GenomicsAotearoa/metagenomics_summer_school  
repo_url: https://github.com/GenomicsAotearoa/metagenomics_summer_school


theme:
  name: material
  logo: ./theme_images/nesi_ga.png
  favicon: ./theme_images/nesi_ga.png
   # 404 page
  static_templates:
    - 404.html

  palette:

  # Palette toggle for automatic mode
  - media: "(prefers-color-scheme)"
    toggle:
      icon: material/brightness-auto
      name: Switch to light mode
    primary: indigo

  # Palette toggle for light mode
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: indigo


    toggle:
      icon: material/brightness-7
      name: Switch to dark mode

  # Palette toggle for dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    toggle:
      icon: material/brightness-4
      name: Switch to system preference
    primary: indigo
  
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
#    - toc.integrate
    - navigation.tabs
    - navigation.tabs.sticky
    - content.code.copy
    - content.code.annotate
    

  # Necessary for search to work properly
  include_search_page: false
  search_index_only: true

  # Default values, taken from mkdocs_theme.yml
  language: en
  font:
    text: Mukta
    code: Roboto Mono

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: squidfunk
      repo: mkdocs-material
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.snippets

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js


plugins: 
  - glightbox:
      effect: zoom
      zoomable: true
  - search:
      lang: en

extra_css:
  - stylesheets/extra.css

nav:
  - 'Home': 'index.md'
  - 'Day 1':
    - 'day1/ex_01_quality_filtering.md'
    - 'day1/ex_02_assembling_contigs.md'
    - 'day1/ex_03_assembly_parameters.md'
    - 'day1/ex_04_assembly_evaluation.md'
    - 'day1/ex_05_assembly_idba-ud.md'
  - 'Day 2':
    - 'day2/ex_06_binning_intro.md'
    - 'day2/ex_07_binning_tools.md'
    - 'day2/ex_08_bin_dereplication.md'
    - 'day2/ex_09_taxonomy.md'
    - 'day2/ex_10_phylogenomics.md'
    - 'day2/ex_11_gene_prediction.md'
    - 'day2/ex_12_gene_annotation_DRAM.md'
    - 'day2/ex_13_gene_annotation_various.md'
  - 'Day 3':
    - 'day3/ex_15_bin_coverage_mapping.md'
    - 'day3/ex_14_gene_annotation_DRAM_distillation.md'
    - 'day3/ex_16_data_presentation_intro.md'
    - 'day3/ex_17_data_presentation_coverage.md'
    - 'day3/ex_14_bin_coverage_dereplication.md'
    - 'day3/ex_18_data_presentation_KEGG_pathways.md'
    - 'day3/ex_19_data_presentation_gene_synteny.md'
  - 'Resources':
    - 'resources/1_APPENDIX_ex16c_data_presentation_Ordination.md'
    - 'resources/2_APPENDIX_ex9_Generating_input_files_for_VizBin.md'
    - 'resources/3_APPENDIX_ex11_Normalise_coverage_example.md'
    - 'resources/4_APPENDIX_ex11_viral_taxonomy_prediction_via_vContact2.md'
    - 'resources/7_command_line_shortcuts.md'
  - 'Supplementary':
